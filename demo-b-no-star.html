<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>横屏首屏布局 · Demo B（无创作之星）</title>
<style>
  :root{
    --bg:#07080d;
    --card:#12151d;
    --card2:#171b25;
    --line:rgba(255,255,255,.08);
    --txt:#eef1f7;
    --dim:#8b93a7;
    --dim2:#5f6678;
    --accent:#ffd166;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:linear-gradient(135deg,#B4CBE4 0%,#6685B6 100%);
    color:var(--txt);
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  /* ---------- 舞台（2560 × 1600，内部按 1280 × 800 布局 2 倍放大） ---------- */
  .viewport{width:2560px;height:1600px;transform-origin:center center;flex:0 0 auto}
  .stage{
    width:1280px;height:800px;padding:18px 166px 20px 20px;
    transform:scale(2);transform-origin:0 0;
    display:flex;flex-direction:column;gap:14px;
    border-radius:24px;overflow:hidden;position:relative;
    background:linear-gradient(135deg,#B4CBE4 0%,#6685B6 100%);
    box-shadow:0 30px 80px rgba(23,43,73,.34), 0 0 0 1px rgba(255,255,255,.28);
  }
  .stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(760px 340px at 16% -6%,rgba(255,255,255,.38),transparent 68%);
  }
  .stage>*{position:relative}

  /* ---------- 顶部 App Bar ---------- */
  .appbar{height:40px;display:flex;align-items:center;gap:22px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.5px;color:#12233a}
  .brand-mark{
    width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;color:#0a0c12;
    background:linear-gradient(135deg,#ffd166,#ff8a5c);box-shadow:0 4px 14px rgba(255,160,80,.35)
  }
  .tabs{display:flex;gap:4px;font-size:13px;color:rgba(18,35,58,.62)}
  .tab{padding:6px 12px;border-radius:9px;cursor:pointer;transition:.2s}
  .tab.active{color:#0a0c12;background:linear-gradient(135deg,#fff,#dfe4f0);font-weight:700}
  .tab:not(.active):hover{background:rgba(255,255,255,.42);color:#12233a}


  /* ---------- 右侧页签栏 ---------- */
  .stage>.rail{
    position:absolute;right:82px;top:18px;bottom:20px;width:68px;z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;
    border-radius:18px;border:1px solid rgba(255,255,255,.26);
    background:#7E9FCB;
    backdrop-filter:blur(12px);
    box-shadow:0 16px 40px rgba(16,32,54,.22)
  }
  .rail-logo{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;
    color:#0a0c12;background:linear-gradient(135deg,#ffd166,#ff8a5c);margin-bottom:10px;
    box-shadow:0 6px 18px rgba(255,160,80,.35)
  }
  .rail-item{
    width:48px;padding:11px 0;border:0;border-radius:12px;background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:inherit;font-size:11px;letter-spacing:.5px;color:rgba(255,255,255,.9);transition:.22s
  }
  .rail-item .ri{font-size:15px;line-height:1;opacity:.8}
  .rail-item:hover{background:rgba(255,255,255,.18);color:#fff}
  .rail-item:hover .ri{opacity:1}
  .rail-item.on{
    color:#0b0d13;background:linear-gradient(135deg,#ffe08a,#ffb04d);
    box-shadow:0 8px 20px rgba(30,55,88,.28)
  }
  .rail-item.on .ri{opacity:1}
  .rail-foot{margin-top:auto}

  /* ---------- 一级页签栏（更外层） ---------- */
  .stage>.rail2{
    position:absolute;right:12px;top:18px;bottom:20px;width:60px;z-index:7;
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;
    border-radius:18px;border:1px solid rgba(255,209,102,.34);
    background:#4E82B2;
    backdrop-filter:blur(12px);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), 0 16px 40px rgba(16,32,54,.22)
  }
  .rail2-item{
    width:44px;padding:10px 0 8px;border:0;border-radius:12px;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:.5px;
    color:rgba(255,255,255,.9);transition:.22s
  }
  .rail2-item .ri2{font-size:15px;line-height:1;opacity:.8}
  .rail2-item:hover{background:rgba(255,255,255,.07);color:#e6ebf6}
  .rail2-item.on{
    color:#0b0d13;background:linear-gradient(135deg,#ffe08a,#ffb04d);
    box-shadow:0 8px 20px rgba(255,176,77,.32)
  }
  .rail2-item.on .ri2{opacity:1}
  .rail2-sep{
    width:26px;height:1px;margin:2px 0 4px;
    background:linear-gradient(90deg,transparent,rgba(255,209,102,.45),transparent)
  }

  /* ---------- 通用卡片 ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden;
    box-shadow:0 12px 30px rgba(18,36,60,.18)
  }
  .row-top{display:grid;grid-template-columns:490px 1fr;gap:14px;height:296px;padding:0 12px;flex:0 0 auto}
  .col-l{display:flex;flex-direction:column;gap:8px;min-height:0}
  .col-title{
    margin:0;height:18px;line-height:18px;flex:0 0 auto;
    font-size:13.5px;font-weight:700;letter-spacing:.4px;color:#12233a
  }

  /* ---------- ① Banner ---------- */
  .banner{flex:1;min-height:0;border:0}
  .banner-track{position:absolute;inset:0}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;pointer-events:none}
  .slide.on{opacity:1;pointer-events:auto}
  .slide-bg{position:absolute;inset:0;opacity:.92}
  .slide-bg::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 78% 46%, rgba(255,255,255,.16), transparent 40%),
      linear-gradient(90deg, rgba(6,8,13,.86) 0%, rgba(6,8,13,.52) 42%, rgba(6,8,13,.05) 72%),
      linear-gradient(0deg, rgba(6,8,13,.72), transparent 55%);
  }
  .slide-art{
    position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(.86);
    width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:58px;
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.34),rgba(255,255,255,.04) 62%);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:inset 0 0 50px rgba(255,255,255,.16), 0 20px 60px rgba(0,0,0,.42);
    transition:transform .8s cubic-bezier(.2,.7,.3,1);
  }
  .slide.on .slide-art{transform:translateY(-50%) scale(1) rotate(-4deg)}
  .slide-ring{
    position:absolute;right:-46px;top:50%;transform:translateY(-50%);
    width:206px;height:206px;border-radius:50%;border:1px dashed rgba(255,255,255,.24)
  }
  .slide-body{position:absolute;left:24px;bottom:34px;max-width:56%}
  .slide-body h2{margin:0 0 8px;font-size:26px;line-height:1.15;letter-spacing:.5px;text-shadow:0 6px 24px rgba(0,0,0,.5)}
  .slide-tags{display:flex;gap:6px;flex-wrap:wrap}
  .slide-tags span{
    font-size:11px;color:#e6ecfa;padding:3px 8px;border-radius:6px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px)
  }
  /* 左上角作者 */
  .slide-author{
    position:absolute;left:24px;top:14px;z-index:3;display:flex;align-items:center;gap:5px;
    font-size:11px;color:rgba(255,255,255,.92);text-shadow:0 2px 10px rgba(0,0,0,.5)
  }
  .slide-author .auico{
    width:11px;height:11px;display:grid;place-items:center;color:#fff;
    background:none;border:0
  }
  .slide-author .auico svg{width:11px;height:11px}
  /* 右上角游玩数 */
  .slide-plays{
    position:absolute;right:22px;top:14px;z-index:3;display:flex;align-items:center;gap:4px;
    font-size:10px;font-weight:700;color:#FF9CC0;text-shadow:0 2px 10px rgba(0,0,0,.55)
  }
  .slide-plays svg{width:14px;height:14px}

  .banner-ui{position:absolute;left:24px;right:18px;bottom:16px;display:flex;align-items:center;justify-content:flex-end}
  .dots{display:flex;gap:5px;align-items:center}
  .dot{width:16px;height:2px;background:rgba(255,255,255,.3);cursor:pointer;transition:.25s;border:0;padding:0}
  .dot.on{width:24px;background:#fff}

  /* ---------- ② 热玩趋势 / 创作之星 / 鉴赏专栏 ---------- */
  .trends{height:100%;padding:26px 0 0;display:flex;flex-direction:column;gap:0;background:transparent;border:0;border-radius:0;overflow:visible}
  .trends-grid{
    flex:1;min-height:0;display:grid;grid-template-columns:297fr 259fr;grid-template-rows:1.15fr 1fr;gap:10px;
  }
  .sub{
    background:linear-gradient(160deg,#F4FAFF,#D8E7F8 62%);
    border:0;border-radius:14px;padding:11px;position:relative;overflow:hidden;
    box-shadow:0 12px 28px rgba(23,43,73,.16)
  }
  .sub-label{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#5A7290;letter-spacing:.4px}
  .sub-label .ico{font-size:11px;filter:saturate(1.2)}

  /* 热玩趋势 */
  .hot{grid-column:1;grid-row:1}
  .hot-theme{font-size:12.5px;font-weight:700;color:#12233a;display:flex;align-items:center;gap:5px;margin-top:7px;min-width:0}
  .hot-theme .hash{font-style:normal;font-weight:800;color:#8AA0B4}
  .hot-theme .ht-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hot-theme .hot-more{
    flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:15px;padding:0 6px;
    font-family:inherit;font-size:9px;font-weight:600;line-height:1;letter-spacing:.2px;
    color:#3B556F;background:rgba(23,43,73,.05);border:1px solid rgba(23,43,73,.14);
    cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,border-color .2s
  }
  .hot-theme .hot-more:hover{background:#7E9FCB;border-color:#7E9FCB;color:#fff}
  .hot-theme .heat{
    font-size:9px;font-weight:700;color:#FF4D8D;white-space:nowrap
  }
  /* 圆点靠上，与创作之星的圆点距上边框一致；标题单独下移 */
  .hot .sub-label{align-items:flex-start;margin-bottom:6px}
  .hot .fade-wrap{margin-top:7px}
  .hot .fade-item{display:flex;flex-direction:column;justify-content:center}
  /* 话题下的玩法卡：与创作之星封面卡同尺寸；卡片连续缓慢左移，循环展示更多玩法 */
  .hot-cards{overflow:hidden;margin-top:0;position:relative}
  .hot-track{display:flex;width:max-content;animation:hotMarquee 20s linear infinite}
  .hot-group{display:flex;gap:8px;padding-right:8px;flex:0 0 auto}
  .hot-cards:hover .hot-track{animation-play-state:paused}
  /* 卡片间隔处不落投影，保持干净无底框 */
  .hot-cards .wk{flex:0 0 auto;width:116px;aspect-ratio:512/330;box-shadow:none}
  @keyframes hotMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .sub-label .mini-dots{margin-left:auto}
  /* 模块名后的榜单入口 */
  .sub-more{
    flex:0 0 auto;display:inline-block;height:15px;padding:0 7px;margin-left:2px;
    font:inherit;font-size:9px;font-weight:600;letter-spacing:.2px;line-height:13px;
    color:#5A7290;cursor:pointer;white-space:nowrap;
    background:rgba(23,43,73,.05);border:1px solid rgba(23,43,73,.12);
    transition:background .2s,color .2s,border-color .2s
  }
  .sub-more:hover{background:#E0A21A;border-color:#E0A21A;color:#fff}
  /* 榜单入口固定在模块左下角 */
  .star .sub-more{position:absolute;left:11px;bottom:11px;margin-left:0;z-index:4}

  /* 创作之星 */
  .star{grid-column:1;grid-row:2}
  .star .fade-item{display:flex;flex-direction:column;justify-content:center}
  .star-body{display:flex;align-items:flex-start;gap:9px;min-width:0}
  .star-face{
    width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;
    border:1px solid rgba(23,43,73,.16)
  }
  .star-info{min-width:0;flex:0 1 auto;display:flex;flex-direction:column;justify-content:flex-start}
  .star-name{font-size:12.5px;font-weight:700;color:#12233a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star-lvl{font-size:9.5px;font-weight:600;color:#6C8298;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 通用玩法封面卡 */
  .wk{
    position:relative;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
    padding:7px 8px;border:1px solid rgba(255,255,255,.16);
    box-shadow:0 8px 20px rgba(0,0,0,.38)
  }
  .wk::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(7,9,14,.92),rgba(7,9,14,.22) 58%,rgba(7,9,14,.02))
  }
  .wk .wico{
    position:absolute;left:7px;top:4px;z-index:1;font-size:33px;line-height:1;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))
  }
  .star-work{margin-left:auto;flex:0 0 auto;width:116px;aspect-ratio:512/330}
  /* 封面右上角游玩数 */
  .wstat{
    position:absolute;right:7px;top:5px;z-index:3;display:flex;align-items:center;gap:2px;
    font-size:9px;font-weight:700;color:#FF4D8D;
    text-shadow:0 1px 6px rgba(255,255,255,.9)
  }
  .wstat svg{width:11px;height:11px}
  .wmeta{position:relative;z-index:2;min-width:0}
  .wmeta .wt{font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px rgba(0,0,0,.7)}
  .wmeta .ws{font-size:8.5px;color:rgba(255,255,255,.78);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fade-wrap{position:relative;flex:1;min-height:0}
  .fade-item{position:absolute;inset:0;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s;pointer-events:none}
  .fade-item.on{opacity:1;transform:none;pointer-events:auto}

  /* 鉴赏专栏 */
  .review{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;padding:0}
  .review-cover{position:relative;width:100%;aspect-ratio:512/330;flex:0 0 auto;overflow:hidden}
  .review-cover .cover-art{
    position:absolute;inset:0;display:grid;place-items:center;font-size:66px;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.45))
  }
  /* 封面右上角游玩数 */
  .cover-stat{
    position:absolute;right:12px;top:10px;z-index:3;display:flex;align-items:center;gap:3px;
    font-size:9.5px;font-weight:700;color:#FF5C97;
    text-shadow:0 1px 6px rgba(255,255,255,.85),0 1px 2px rgba(255,255,255,.9)
  }
  .cover-stat svg{width:13px;height:13px}
  .review-inner{padding:3px 11px 5px;flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:2}
  .review-map{font-size:13px;line-height:1.1;font-weight:700;color:#12233a;display:flex;align-items:center;gap:6px}
  .review-who{margin-top:4px;display:flex;align-items:center;gap:6px;font-size:10px;color:#5A7290}
  .review-who .mini-dots{margin-left:auto;flex:0 0 auto}
  .review-who .dotav{
    width:17px;height:17px;border-radius:5px!important;display:grid;place-items:center;font-size:11px;line-height:1;
    background:rgba(23,43,73,.1);box-shadow:inset 0 0 0 1px rgba(23,43,73,.08)
  }
  .review-quote{
    margin-top:4px;font-size:10.5px;line-height:1.5;color:#3B556F;flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:32px;transition:opacity .28s ease,transform .28s cubic-bezier(.2,.7,.3,1)
  }
  .review-quote::before{content:"“";color:rgba(193,134,26,.8);font-size:14px;margin-right:1px}
  .review-foot{
    margin-top:3px;padding-top:4px;border-top:1px solid rgba(23,43,73,.12);
    display:flex;align-items:center;gap:8px;font-size:9.5px;color:#6C8298
  }
  .review-foot .k{margin-left:auto;color:#0E8C62}
  .mini-dots{display:flex;gap:4px}
  .mini-dots i{width:4px;height:4px;border-radius:2px;background:rgba(23,43,73,.18);transition:.3s}
  .mini-dots i.on{width:12px;background:#E0A21A}

  /* ---------- ③ 大家都在玩 ---------- */
  .playing{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}
  .sec-head{display:flex;align-items:center;gap:8px}
  .sec-head h3{margin:0;font-size:13.5px;letter-spacing:.4px;color:#12233a}
  .sec-head .sub-t{font-size:10px;color:rgba(18,35,58,.55)}
  .games{
    flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(2,auto);align-content:center;gap:12px
  }
  .game{
    position:relative;aspect-ratio:512/330;border-radius:0;overflow:hidden;cursor:pointer;
    display:flex;flex-direction:column;background:#fff;
    border:1px solid rgba(23,43,73,.1);transition:transform .25s,box-shadow .25s,border-color .25s
  }
  .gcover{position:relative;flex:1;min-height:0;overflow:hidden}
  .gcover::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(0deg,rgba(255,255,255,.55),rgba(255,255,255,.14) 52%,rgba(255,255,255,0) 84%)
  }
  .game:hover{transform:translateY(-4px);border-color:rgba(23,43,73,.28);box-shadow:0 18px 38px rgba(23,43,73,.24)}
  .gcover>*{position:relative;z-index:2}
  .gcover .gico{
    position:absolute!important;right:16px;top:50%;transform:translateY(-50%);
    font-size:46px;opacity:.92;z-index:1;
    filter:drop-shadow(0 8px 16px rgba(23,43,73,.22))
  }
  /* 封面左上角作者 */
  .gcover .gauthor{
    position:absolute;left:11px;top:10px;z-index:3;display:flex;align-items:center;gap:4px;
    font-size:10px;font-weight:600;color:rgba(18,35,58,.72);
    text-shadow:0 1px 6px rgba(255,255,255,.9)
  }
  .gcover .gauthor svg{width:10px;height:10px}
  /* 封面右上角游玩数 */
  .gcover .gstat{
    position:absolute;right:13px;top:11px;z-index:3;display:flex;align-items:center;gap:3px;
    font-size:9.5px;font-weight:700;color:#FF4D8D;
    text-shadow:0 1px 6px rgba(255,255,255,.9)
  }
  .gstat svg{width:13px;height:13px}
  /* 封面左下角玩法标签 */
  .gcover .gtag{
    position:absolute;left:11px;bottom:9px;z-index:3;
    font-size:9.5px;font-weight:600;color:rgba(18,35,58,.7);
    padding:2px 7px;background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(4px)
  }
  /* 封面外：浅白底玩法名 */
  .gname{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px;height:30px;
    background:rgba(255,255,255,.94);border-top:1px solid rgba(23,43,73,.08)
  }
  .gname .gn{font-size:13.5px;font-weight:700;letter-spacing:.3px;color:#12233a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ---------- 布局说明标注 ---------- */
  .anno-chip{
    position:absolute;left:8px;top:8px;z-index:20;width:19px;height:19px;border-radius:50%;
    display:grid;place-items:center;font-size:11px;font-weight:700;color:#0b0d13;
    background:var(--accent);box-shadow:0 0 0 3px rgba(255,209,102,.18);opacity:0;transition:.3s
  }
  .anno-tag{
    position:absolute;left:8px;bottom:8px;z-index:20;font-size:9.5px;padding:2px 6px;border-radius:5px;
    color:#ffe9b0;background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.4);
    opacity:0;transition:.3s;white-space:nowrap;pointer-events:none
  }
  body.annotate .anno-chip,body.annotate .anno-tag{opacity:1}
  body.annotate [data-anno]{outline:1px dashed rgba(255,209,102,.55);outline-offset:-1px;border-radius:12px}

  .legend{
    position:fixed;left:50%;bottom:14px;transform:translate(-50%,26px);z-index:99;

/* ---------------- 工具 ---------------- */
function loop(el, fn, ms){
  let t = null;
  const start = () => { clear(); t = setInterval(fn, ms); };
  const clear = () => { if(t) clearInterval(t); t = null; };
  if(el){ el.addEventListener('mouseenter', clear); el.addEventListener('mouseleave', start); }
  start();
  return {start, clear};
}

  const track = $('#bannerTrack'), dots = $('#bannerDots');
  track.innerHTML = banners.map((b,i)=>`
    <div class="slide${i===0?' on':''}">
      <div class="slide-bg" style="background:linear-gradient(115deg,${b.c1},${b.c2})"></div>
      <div class="slide-ring"></div>
      <div class="slide-art">${b.emoji}</div>
      <div class="slide-author"><span class="auico">${SVG_USER}</span>${b.author}</div>
      <div class="slide-plays">${SVG_PAD}${b.plays}</div>
      <div class="slide-body">
        <h2>${b.name}</h2>
        <div class="slide-tags">${b.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');
  dots.innerHTML = banners.map((_,i)=>`<button class="dot${i===0?' on':''}" data-i="${i}" aria-label="第${i+1}张"></button>`).join('');

  const slides = $$('.slide', track);
  const dts = $$('.dot', dots);
  let cur = 0;

  function show(i){
    cur = (i + slides.length) % slides.length;
    slides.forEach((s,k)=>s.classList.toggle('on', k===cur));
    dts.forEach((d,k)=>d.classList.toggle('on', k===cur));
  }
  const timer = loop($('.banner'), ()=>show(cur+1), 5000);
  dots.addEventListener('click', e => {
    const d = e.target.closest('.dot');
    if(!d) return;
    show(+d.dataset.i);
    timer.start();
  });
  show(0);
})();

(function mountHot(){
  const wrap = $('#hotWrap'), dots = $('#hotDots');
  const themeHTML = t => `<i class="hash">#</i><span class="ht-name">${t.theme}</span>`
    + `<span class="heat">热度 ${t.heat}</span><button class="hot-more" type="button">查看详情</button>`;
  const cardHTML = m => `
        <div class="wk" style="background:linear-gradient(135deg,${m.c1},${m.c2})">
          <div class="wico">${m.wico}</div>
          <div class="wstat">${SVG_PAD}${m.plays}</div>
          <div class="wmeta">
            <div class="wt">${m.name}</div>
            <div class="ws">${m.wtag}</div>
          </div>
        </div>`;
  /* 一页两个话题：一个话题一行，各自玩法无缝滚动 */
  const rowHTML = (t, ti) => {
    /* 两组相同卡片首尾相接，translateX(-50%) 时无缝衔接 */
    const group = `<div class="hot-group">${t.cards.map(cardHTML).join('')}</div>`;
    return `
      <div class="hot-row" data-ti="${ti}">
        <div class="sub-label"><div class="hot-theme">${themeHTML(t)}</div></div>
        <div class="hot-cards">
          <div class="hot-track">${group}${group.replace('hot-group','hot-group" aria-hidden="true')}</div>
        </div>
      </div>`;
  };
  const pages = [];
  for(let i = 0; i < hotTopics.length; i += 2) pages.push(hotTopics.slice(i, i + 2));
  wrap.innerHTML = pages.map((grp, pi)=>`
    <div class="fade-item${pi===0?' on':''}">
      <div class="hot-page">${grp.map((t, ri)=>rowHTML(t, pi * 2 + ri)).join('')}</div>
    </div>`).join('');
  dots.innerHTML = pages.map((_, pi)=>`<i class="${pi===0?'on':''}"></i>`).join('');

  /* 每张玩法卡绑定对应玩法数据（横向卡带是双份复制，取模即可） */
  $$('.fade-item', wrap).forEach((it, pi)=>{
    $$('.hot-row', it).forEach((row, ri)=>{
      const t = pages[pi][ri];
      if(!t) return;
      $$('.wk', row).forEach((wk, ci)=>{
        wk._game = t.cards[ci % t.cards.length];
        wk.style.cursor = 'pointer';
      });
    });
  });

  const items = $$('.fade-item', wrap), dts = $$('i', dots);
  let cur = 0;
  function show(i){
    cur = (i + items.length) % items.length;
    items.forEach((el, k)=>el.classList.toggle('on', k === cur));
    dts.forEach((d, k)=>d.classList.toggle('on', k === cur));
  }

  /* 点击：单张玩法卡 → 玩法详情；其余区域 → 该话题的完整列表 */
  wrap.addEventListener('click', e=>{
    const row = e.target.closest('.hot-row');
    if(!row) return;
    const ti = +row.dataset.ti;
    const wk = e.target.closest('.wk');
    if(wk && wk._game){ OU_openGame(wk._game); return; }
    OU_openList(ti);
  });
  loop($('.hot'), ()=>show(cur+1), 12000);   // 两个话题一组，12s 自动轮换
})();

(function mountReview(){
  const cover = $('#revCover'), art = $('#revArt');
  const map = $('#revMap'), name = $('#revName');
  const ava = $('#revAva'), quote = $('#revQuote'), likes = $('#revLikes'), dots = $('#revDots');
  const stat = $('#revStat');
  let mi = 0, ci = 0;

  /* 评语位：同一玩法内上下切换 */
  function paintDots(){
    dots.innerHTML = reviews[mi].critics.map((_,k)=>`<i class="${k===ci?'on':''}"></i>`).join('');
  }
  function paintCritic(){
    const m = reviews[mi], c = m.critics[ci];
    /* 评语位不允许为空：缺字段时回退到同玩法其他评语，再兜底 */
    const text = (c.text || '').trim()
      || m.critics.map(x => (x.text || '').trim()).find(Boolean)
      || '这段玩法还没等到评语，先自己进去走一遍吧。';
    name.textContent = c.name;
    ava.textContent = c.ava;
    quote.textContent = text;
    likes.textContent = c.likes;
    paintDots();
  }
  function paintMap(){
    const m = reviews[mi];
    cover.style.background = `linear-gradient(140deg, ${m.c1}, ${m.c2})`;
    art.textContent = m.art;
    map.textContent = m.map;
    stat.innerHTML = SVG_PAD + `<span>${m.plays}</span>`;
    paintCritic();
  }

  /* 竖向滑动切换：先写内容再淡入，任何时刻评语都不为空 */
  function slideQuote(dir, done){
    quote.style.transition = 'none';
    quote.style.opacity = '.45';   // 只做浅淡过渡，避免整行看起来是空的
    quote.style.transform = `translateY(${dir > 0 ? 10 : -10}px)`;
    done();                        // 内容同步落位，不依赖动画回调
    void quote.offsetWidth;        // 强制回流，使下面这次变化产生过渡
    quote.style.transition = '';
    quote.style.opacity = '1';
    quote.style.transform = 'translateY(0)';
  }

  /* 评语每 3s 换一位；走完最后一位就停住，等 10s 到点换玩法 */
  function nextCritic(){
    if(ci >= reviews[mi].critics.length - 1) return;
    ci += 1;
    slideQuote(1, paintCritic);
  }
  function nextMap(){
    mi = (mi + 1) % reviews.length;
    ci = 0;
    slideQuote(1, paintMap);
    criticTimer.start();      // 换玩法后，新玩法的第一条评语重新计满 3s
  }

  paintMap();
  const criticTimer = loop($('.review'), nextCritic, 3000);   // 评语 3s
  const mapTimer = loop($('.review'), nextMap, 10000);        // 玩法 10s
  /* 点击卡片任意位置：打开当前玩法的详情页（示意） */
  $('.review').style.cursor = 'pointer';
  $('.review').addEventListener('click', ()=>{
    const m = reviews[mi];
    OU_openGame({name:m.map, wico:m.art, wtag:'鉴赏推荐', plays:m.plays, author:'鉴赏家精选', c1:m.c1, c2:m.c2});
  });
})();

/* ---------------- 弹窗：玩法列表 / 玩法详情 / 作者客态主页 ---------------- */
const OUModal = (function(){
  const layer = document.createElement('div');
  layer.className = 'mlayer';
  layer.setAttribute('aria-hidden','true');
  layer.innerHTML = `
    <div class="mscrim" data-close></div>
    <div class="mpanel" role="dialog" aria-modal="true">
      <button class="mclose" type="button" data-close aria-label="关闭">✕</button>
      <div class="mscroll" id="ouScroll"></div>
    </div>`;
  document.body.appendChild(layer);
  const panel = $('.mpanel', layer), scroll = $('#ouScroll', layer);
  let opened = false;

  function show(size, html, rail){
    layer.className = 'mlayer show ' + size;
    scroll.innerHTML = html;
    panel.classList.toggle('has-rail', !!rail);
    panel.querySelectorAll('.mrail').forEach(n=>n.remove());
    if(rail){
      const nav = document.createElement('nav');
      nav.className = 'mrail';
      nav.innerHTML = rail;
      panel.appendChild(nav);
    }
    scroll.scrollTop = 0;
    layer.setAttribute('aria-hidden','false');
    opened = true;
  }
  function close(){
    opened = false;
    layer.className = 'mlayer';
    layer.setAttribute('aria-hidden','true');
  }
  layer.addEventListener('click', e=>{
    if(e.target.closest('[data-close]')){ close(); return; }
    const tab = e.target.closest('.mrail-item');
    if(tab){ OU_switchTab(+tab.dataset.tab); return; }
    const card = e.target.closest('.mcard');
    if(!card) return;
    if(card.dataset.g){
      try{ OU_openGame(JSON.parse(decodeURIComponent(card.dataset.g))); }catch(err){}
    }else if(card.dataset.au){
      try{ OU_openAuthor(JSON.parse(decodeURIComponent(card.dataset.au))); }catch(err){}
    }
  });
  addEventListener('keydown', e=>{ if(e.key === 'Escape' && opened) close(); });
  /* 遮罩上滚轮不再带动背后页面滚动 */
  layer.addEventListener('wheel', e=>{ if(!e.target.closest('.mscroll')) e.preventDefault(); }, {passive:false});
  return {show, close};
})();

      <span class="mau">${SVG_USER}${g.author || '热门玩法'}</span>

      <span class="mico">${g.wico || g.emoji || '🎮'}</span>

}
/* 话题玩法 + 全站热门补足，凑满三行九张 */
function OU_hotCards(t){
  const base = t.cards.map(m=>({name:m.name, wico:m.wico, wtag:m.wtag, plays:m.plays, author:'热门玩法', c1:m.c1, c2:m.c2}));
  const more = games
    .filter(g => !base.some(b => b.name === g.name))
    .slice(0, Math.max(0, 9 - base.length))
    .map(g=>({name:g.name, wico:g.emoji, wtag:g.tag, plays:g.players, author:g.author, c1:g.c1, c2:g.c2}));
  return base.concat(more);
}

    `<button class="mrail-item${i === active ? ' on' : ''}" type="button" data-tab="${i}" title="${label}"><span class="mrail-in"><span class="mrail-txt">${label}</span></span></button>`

/* 文案比 5 字窗口宽时启用滚动 */
function OU_fitTabs(){
  document.querySelectorAll('.mrail-item').forEach(b=>{
    const w = b.querySelector('.mrail-in'), t = b.querySelector('.mrail-txt');
    if(w && t) b.classList.toggle('scroll', t.offsetWidth > w.clientWidth);

function OU_openView(view){
  OU_cur = view;
  const v = view.build(view.active);
  OUModal.show('full', `
    <div class="mhead">
      <h2>${v.title}</h2>
    </div>
    <div class="mrule"></div>
    <div class="mgrid">${v.cardsHTML}</div>`, OU_railHTML(view.tabs, view.active));
  OU_fitTabs();
}
/* 页签切换：只换标题与网格，弹层不重播入场动画 */
function OU_switchTab(i){
  if(!OU_cur || i === OU_cur.active) return;
  const v = OU_cur.build(i);
  OU_cur.active = i;
  const sc = document.querySelector('.mlayer .mscroll');
  const rail = document.querySelector('.mlayer .mrail');
  if(!sc || !rail) return;
  const h2 = sc.querySelector('.mhead h2');
  if(h2) h2.textContent = v.title;
  rail.querySelectorAll('.mrail-item').forEach((b, j)=>b.classList.toggle('on', j === i));
  const grid = sc.querySelector('.mgrid');
  if(grid) grid.innerHTML = v.cardsHTML;
  sc.scrollTop = 0;
  OU_fitTabs();
}

  const resize = () => {
    const s = Math.min(innerWidth / 2560, innerHeight / 1600) * 0.94;
    vp.style.transform = `scale(${s})`;
  };
  addEventListener('resize', resize);
  resize();
})();

/* ---------------- 布局说明 ---------------- */
(function anno(){
  $('.trends').insertAdjacentHTML('afterbegin', '<div class="anno-chip">2</div>');
  const btn = $('#toggleAnno');
  btn.addEventListener('click', () => {
    const on = document.body.classList.toggle('annotate');
    btn.textContent = on ? '隐藏布局说明' : '显示布局说明';
  });
})();

/* ---------------- 右侧页签切换 ---------------- */
[['#rail','.rail-item'], ['#rail2','.rail2-item']].forEach(([id, sel]) => {
  $(id).addEventListener('click', e => {
    const it = e.target.closest(sel);
    if(!it) return;
    $$(sel, $(id)).forEach(x => x.classList.toggle('on', x === it));
  });
});
</script>
